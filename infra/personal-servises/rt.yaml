---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rt-dash
  namespace: personal-servises
data:
  DASH_CONTROL_URL: "https://rt.kolchurin.dev"
  DASH_K8S_NODE: "hetzner-s0"
  DASH_TZ: "Europe/Prague"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rt-dash-data
  namespace: personal-servises
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rt-dash
  namespace: personal-servises
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rt-dash-node-metrics
rules:
  - apiGroups: [""]               # the node object: its capacity
    resources: ["nodes"]
    resourceNames: ["hetzner-s0"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"] # metrics-server: its usage
    resources: ["nodes"]
    resourceNames: ["hetzner-s0"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rt-dash-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rt-dash-node-metrics
subjects:
  - kind: ServiceAccount
    name: rt-dash
    namespace: personal-servises
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rt-dash
  namespace: personal-servises
  labels: { app: rt-dash }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: rt-dash }
  template:
    metadata:
      labels: { app: rt-dash }
    spec:
      serviceAccountName: rt-dash
      nodeSelector:
        kubernetes.io/hostname: hetzner-s0
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rt-dash
          image: ghcr.io/kolchurinvv/raspberry-tunnel-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rt-dash
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey
                  key: TS_AUTHKEY
                  optional: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /_dash/readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_dash/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/dashboard
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rt-dash-data
---
apiVersion: v1
kind: Service
metadata:
  name: rt-dash
  namespace: personal-servises
spec:
  selector: { app: rt-dash }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rt-dash
  namespace: personal-servises
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: rt.kolchurin.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rt-dash
                port:
                  number: 8080
