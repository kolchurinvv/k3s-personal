apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: personal-servises

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml

# The ConfigMap and Secret are plain resources, so editing them does not restart
# the pod on its own. After changing config, run:
#   kubectl rollout restart deployment/tix-watch -n personal-servises
