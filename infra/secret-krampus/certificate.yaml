# TLS for secretkrampus.party, issued via the existing Cloudflare DNS-01
# ClusterIssuer. Unlike the kolchurin.dev hosts, this one is NOT covered by the
# wildcard in Traefik's default TLSStore, so the Ingress names this Secret in
# its own `tls:` block.
#
# Prerequisite: the Cloudflare API token behind `cloudflare-api-token`
# (cert-manager namespace) must include the secretkrampus.party zone
# (Zone:DNS:Edit) — otherwise the DNS-01 challenge can't create its TXT record.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: secretkrampus-party
  namespace: secret-krampus
spec:
  secretName: secretkrampus-party-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "secretkrampus.party"
