# Non-secret settings. Change and roll out with
# `kubectl rollout restart deployment/secret-krampus -n secret-krampus` — no image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-krampus
  namespace: secret-krampus
data:
  # Where browsers reach the app. Better Auth checks request origins against it.
  PUBLIC_URL: "https://secretkrampus.party"
  BETTER_AUTH_URL: "https://secretkrampus.party"

  # Resend sender; the domain must be verified in Resend.
  EMAIL_FROM: "Secret Krampus <krampus@secretkrampus.party>"

  # Cloudflare R2 avatar storage. The endpoint is the bucket's S3 API URL
  # WITHOUT the /secret-krampus path — the bucket is set separately. Objects are
  # served publicly through the bucket's custom domain.
  R2_ENDPOINT: "https://f9e371667244609d910373676cf12011.r2.cloudflarestorage.com"
  R2_BUCKET: "secret-krampus"
  AVATAR_BASE_URL: "https://img.secretkrampus.party"
