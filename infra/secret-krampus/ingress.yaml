# Routes secretkrampus.party -> the app over HTTPS.
#
# Prerequisite: a Cloudflare A record secretkrampus.party -> 135.125.237.68
# (ovh-s1, where Traefik binds :80/:443), DNS-only (grey cloud) like the
# kolchurin.dev hosts — the long-lived SSE stream and the Let's Encrypt cert
# then go straight to Traefik.
#
# Unlike the kolchurin.dev Ingresses, this one names its TLS Secret: the default
# TLSStore only serves the *.kolchurin.dev wildcard. The Secret is written by
# certificate.yaml in this namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secret-krampus
  namespace: secret-krampus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - secretkrampus.party
      secretName: secretkrampus-party-tls
  rules:
    - host: secretkrampus.party
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secret-krampus
                port:
                  number: 3000
