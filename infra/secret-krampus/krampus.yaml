# Secret Krampus — Secret Santa, the Krampus gift vote and party contests at
# https://secretkrampus.party. App repo: ~/Dev_Projects/secret-krampus
#
# One Bun pod (Hono API + SSE stream + the built Solid SPA) on a single SQLite
# file. Avatars live in the `secret-krampus` R2 bucket behind
# img.secretkrampus.party, and email goes out through Resend.
#
# (Named krampus.yaml, not secret-krampus.yaml: this repo's .gitignore ignores
# `*secret*.yaml`, so that name would silently never be committed.)
#
# Prerequisites:
#   - Cloudflare A record secretkrampus.party -> 135.125.237.68 (ovh-s1, where
#     Traefik binds :80/:443), DNS-only like the kolchurin.dev hosts — the
#     long-lived SSE stream and the Let's Encrypt cert go straight to Traefik.
#   - The Cloudflare token behind `cloudflare-api-token` (cert-manager namespace)
#     must include the secretkrampus.party zone (Zone:DNS:Edit), or the DNS-01
#     challenge can't create its TXT record.
#   - The image is pushed: `just push` in the app repo.
#
# Two Secrets back this app and are NOT in git (they hold credentials). Create
# the namespace, then both Secrets, then apply this file:
#
#   kubectl create namespace secret-krampus
#
#   kubectl create secret docker-registry ghcr-pull -n secret-krampus \
#     --docker-server=ghcr.io --docker-username=kolchurinvv \
#     --docker-password=<read:packages PAT>
#
#   # App credentials. Put the values in a throwaway env file outside git so
#   # they stay out of shell history, then delete it:
#   #   BETTER_AUTH_SECRET=<openssl rand -base64 32>
#   #   RESEND_API_KEY=re_...
#   #   R2_ACCESS_KEY_ID=<R2 account API token: Access Key ID>
#   #   R2_SECRET_ACCESS_KEY=<R2 account API token: Secret Access Key>
#   #   ADMIN_EMAILS=<comma-separated admin emails>
#   kubectl create secret generic secret-krampus-env -n secret-krampus \
#     --from-env-file=./secret-krampus.env
#
#   kubectl apply -f infra/secret-krampus/krampus.yaml
#
# The ConfigMap and Secret are plain resources, so editing them does not restart
# the pod on its own. After changing either, run:
#   kubectl rollout restart deployment/secret-krampus -n secret-krampus
---
apiVersion: v1
kind: Namespace
metadata:
  name: secret-krampus
---
# Non-secret settings. Change and roll out with
# `kubectl rollout restart deployment/secret-krampus -n secret-krampus` — no image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-krampus
  namespace: secret-krampus
data:
  # Where browsers reach the app. Better Auth checks request origins against it.
  PUBLIC_URL: "https://secretkrampus.party"
  BETTER_AUTH_URL: "https://secretkrampus.party"
  # Resend sender; the domain must be verified in Resend.
  EMAIL_FROM: "Secret Krampus <krampus@secretkrampus.party>"
  # Cloudflare R2 avatar storage. The endpoint is the bucket's S3 API URL
  # WITHOUT the /secret-krampus path — the bucket is set separately. Objects are
  # served publicly through the bucket's custom domain.
  R2_ENDPOINT: "https://f9e371667244609d910373676cf12011.r2.cloudflarestorage.com"
  R2_BUCKET: "secret-krampus"
  AVATAR_BASE_URL: "https://img.secretkrampus.party"
---
# TLS for secretkrampus.party, issued via the existing Cloudflare DNS-01
# ClusterIssuer. Unlike the kolchurin.dev hosts, this one is NOT covered by the
# wildcard in Traefik's default TLSStore, so the Ingress names this Secret in
# its own `tls:` block.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: secretkrampus-party
  namespace: secret-krampus
spec:
  secretName: secretkrampus-party-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "secretkrampus.party"
---
# Holds the SQLite database (/data/krampus.db). local-path pins the volume, and
# so the pod, to whichever node first mounts it — the Deployment selects
# hetzner-s0 explicitly so that's deterministic.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secret-krampus-data
  namespace: secret-krampus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# One Bun process: Hono API + SSE stream + the built Solid SPA, backed by a
# single SQLite file. Secrets come from `secret-krampus-env` and the image pull
# secret `ghcr-pull`, both created imperatively (see the header).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-krampus
  namespace: secret-krampus
  labels:
    app.kubernetes.io/name: secret-krampus
spec:
  replicas: 1
  # SQLite has one writer and the live SSE fan-out is in-process, so exactly
  # one pod may run; the old one must stop before the new one opens the file.
  # (A rolling update of a single replica overlaps — and RWO local-path would
  # block it anyway.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-krampus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-krampus
    spec:
      nodeSelector:
        kubernetes.io/hostname: hetzner-s0
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The PVC and emptyDir are root-owned by default; fsGroup makes them
        # writable for the unprivileged user under a read-only root filesystem.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-krampus
          image: ghcr.io/kolchurinvv/secret-krampus:latest
          imagePullPolicy: Always          # :latest is mutable; re-pull on restart
          envFrom:
            - configMapRef:
                name: secret-krampus
            - secretRef:
                name: secret-krampus-env
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
            # Bun's HOME and any temp files; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: secret-krampus-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: secret-krampus
  namespace: secret-krampus
  labels:
    app.kubernetes.io/name: secret-krampus
spec:
  selector:
    app.kubernetes.io/name: secret-krampus
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Routes secretkrampus.party -> the app over HTTPS. Unlike the kolchurin.dev
# Ingresses, this one names its TLS Secret: the default TLSStore only serves
# the *.kolchurin.dev wildcard. The Secret is written by the Certificate above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secret-krampus
  namespace: secret-krampus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - secretkrampus.party
      secretName: secretkrampus-party-tls
  rules:
    - host: secretkrampus.party
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secret-krampus
                port:
                  number: 3000
