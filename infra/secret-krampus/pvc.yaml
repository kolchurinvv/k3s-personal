# Holds the SQLite database (/data/krampus.db). local-path pins the volume, and
# so the pod, to whichever node first mounts it — the Deployment selects
# hetzner-s0 explicitly so that's deterministic.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secret-krampus-data
  namespace: secret-krampus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
